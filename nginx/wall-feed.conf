# homelab-wall-feed: read-only gateway for the wall pages.
#
# Include inside the wall's `server {}` block. The deployer defines the
# upstream (`upstream prometheus { server <fqdn>:<port>; }`) in its own file,
# so nothing here names a host.
#
# Exposed: GET/HEAD /api/prom/query and /api/prom/query_range only. Every
# other /api/ path is 404; every other method is 403.

location = /api/prom/query {
    limit_except GET { deny all; }
    proxy_pass http://prometheus/api/v1/query;
    include wall-feed-proxy.conf;
}

location = /api/prom/query_range {
    limit_except GET { deny all; }
    proxy_pass http://prometheus/api/v1/query_range;
    include wall-feed-proxy.conf;
}

location /api/ {
    return 404;
}
