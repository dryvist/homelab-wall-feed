# homelab-wall-feed: read-only gateway for the wall pages.
#
# Include inside the wall's `server {}` block. The deployer defines the
# upstreams (`upstream prometheus { server <fqdn>:<port>; }` and
# `upstream clickhouse { server <fqdn>:<port>; }`) in its own files, so
# nothing here names a host. It also supplies wall-feed-clickhouse-auth.conf
# beside this file with the `proxy_set_header X-ClickHouse-User` and
# `X-ClickHouse-Key` lines for the read-only ClickHouse user, so no
# credential lives here either.
#
# Exposed: GET/HEAD /api/prom/query, /api/prom/query_range, /api/words and
# /api/llm/recent only. Every other /api/ path is 404; every other method
# is 403.

location = /api/prom/query {
    limit_except GET { deny all; }
    proxy_pass http://prometheus/api/v1/query;
    include wall-feed-proxy.conf;
}

location = /api/prom/query_range {
    limit_except GET { deny all; }
    proxy_pass http://prometheus/api/v1/query_range;
    include wall-feed-proxy.conf;
}

location = /api/words {
    limit_except GET { deny all; }
    proxy_pass http://clickhouse/wall/words;
    include wall-feed-proxy.conf;
    include wall-feed-clickhouse-auth.conf;
}

location = /api/llm/recent {
    limit_except GET { deny all; }
    proxy_pass http://clickhouse/wall/recent;
    include wall-feed-proxy.conf;
    include wall-feed-clickhouse-auth.conf;
}

location /api/ {
    return 404;
}
