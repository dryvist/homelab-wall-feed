name: Release assets

# Attaches the nginx gateway config as a tarball, plus its
# sha256, to every release; the wall role downloads both at a pinned version.
on:
  release:
    types: [published]

permissions: {}

jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: tar -czf homelab-wall-feed-nginx.tar.gz -C nginx .
      - run: sha256sum homelab-wall-feed-nginx.tar.gz > homelab-wall-feed-nginx.tar.gz.sha256
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: |
            homelab-wall-feed-nginx.tar.gz
            homelab-wall-feed-nginx.tar.gz.sha256
